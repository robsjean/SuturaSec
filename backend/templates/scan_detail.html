{% extends "base_app.html" %}
{% block title %}Analyse · SuturaSec{% endblock %}

{% block content %}
<div class="stack" style="gap:24px" x-data="scanDetailApp({{ scan_id }})" x-init="init()">

  <nav class="crumbs" aria-label="Fil d'Ariane">
    <a href="/dashboard">Analyses</a><span aria-hidden="true">/</span>
    <span style="color:var(--text)" x-text="scan?.target || '…'"></span>
  </nav>

  <div class="loading" x-show="loading"><span class="spinner" aria-hidden="true"></span>Chargement de l'analyse…</div>

  <div class="card empty" x-show="!loading && !scan" x-cloak>
    <h2>Analyse introuvable</h2>
    <p>Elle a peut-être été supprimée.</p>
    <a class="btn" href="/dashboard" style="margin-top:8px">Retour au tableau de bord</a>
  </div>

  <template x-if="scan">
    <div class="stack" style="gap:24px">

      <!-- En-tête -->
      <header class="page-head" style="align-items:flex-start">
        <div style="min-width:0">
          <h1 class="mono" style="font-family:var(--mono);font-size:22px;overflow-wrap:anywhere" x-text="scan.target"></h1>
          <div class="meta">
            <span class="type"><span x-html="icon(scan.scan_type)"></span><span x-text="'Analyse ' + typeLabel(scan.scan_type)"></span></span>
            <span class="status"><span class="dot" :class="statusDot(scan.status)"></span><span x-text="statusLabel(scan.status)"></span></span>
            <span x-text="fmtDate(scan.created_at)"></span>
            <span x-show="duration" x-text="'Durée ' + duration"></span>
          </div>
        </div>
        <div class="actions">
          <button class="btn btn-ink" type="button" x-show="scan.status === 'completed'" @click="openReport()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
            Rapport PDF
          </button>
        </div>
      </header>

      <!-- En cours -->
      <section class="card card-pad stack" style="gap:16px" x-show="scan.status === 'running' || scan.status === 'pending'" aria-live="polite">
        <div class="row"><span class="spinner" aria-hidden="true"></span>
          <h2 x-text="scan.status === 'running' ? 'Analyse en cours' : 'Analyse en attente de démarrage'"></h2></div>
        <div class="bar"><span style="width:40%;background:var(--accent)"></span></div>
        <p class="small muted">Les résultats s'afficheront automatiquement. Vous pouvez quitter cette page : l'analyse continue.</p>
      </section>

      <!-- Échec -->
      <section class="card card-pad stack" x-show="scan.status === 'failed'">
        <div class="note fail" role="alert">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v4M12 17.5v.5"/></svg>
          <div><b style="font-weight:600">L'analyse n'a pas pu aboutir.</b><br>Vérifiez que la cible est correcte et accessible, puis relancez une analyse.</div>
        </div>
        <div class="actions"><a class="btn btn-primary" :href="'/dashboard?scan=' + scan.scan_type">Relancer une analyse</a></div>
      </section>

      <template x-if="scan.status === 'completed'">
        <div class="stack" style="gap:24px">

          <!-- Synthèse -->
          <section class="grid-2" aria-label="Synthèse" x-show="scan.scan_type !== 'subdomain'">
            <div class="card card-pad stack" style="gap:12px">
              <p class="small muted">Score de risque</p>
              <div class="score">
                <strong :class="riskCls(scan.risk_score)" x-text="scan.risk_score != null ? scan.risk_score.toFixed(1) : '—'"></strong>
                <span x-text="'/ 10' + (scan.risk_score != null ? ' · ' + riskLabel(scan.risk_score) : '')"></span>
              </div>
              <div class="bar" :class="riskBar(scan.risk_score)"><span :style="`width:${(scan.risk_score || 0) * 10}%`"></span></div>
            </div>
            <div class="card card-pad stack" style="gap:14px">
              <div class="row between"><p class="small muted">Vulnérabilités par sévérité</p><b class="num" x-text="scan.vulnerabilities.length"></b></div>
              <div class="stacked" aria-hidden="true" x-show="scan.vulnerabilities.length">
                <template x-for="s in SEVS" :key="s">
                  <span :style="`width:${count(s) / scan.vulnerabilities.length * 100}%;background:var(--${s === 'info' ? 'border-strong' : s})`"></span>
                </template>
              </div>
              <dl class="legend">
                <template x-for="s in SEVS" :key="s">
                  <div><dt x-text="sevLabel(s)"></dt><dd x-text="count(s)"></dd></div>
                </template>
              </dl>
            </div>
          </section>

          <section class="stats" x-show="scan.scan_type === 'subdomain'" aria-label="Synthèse">
            <div class="stat"><p>Sous-domaines</p><strong x-text="sub?.total_found ?? '—'"></strong><small>découverts</small></div>
            <div class="stat"><p>Actifs HTTP</p><strong x-text="sub?.summary?.active_http ?? '—'"></strong><small>répondent</small></div>
            <div class="stat"><p>Takeover</p><strong :class="sub?.summary?.takeover_risks > 0 ? 'c-critical' : ''" x-text="sub?.summary?.takeover_risks ?? 0"></strong><small>à corriger</small></div>
            <div class="stat"><p>Dev exposés</p><strong :class="sub?.summary?.dev_exposed > 0 ? 'c-medium' : ''" x-text="sub?.summary?.dev_exposed ?? 0"></strong><small>environnements</small></div>
          </section>

          <!-- Onglets -->
          <nav class="tabs" role="tablist" aria-label="Sections de l'analyse">
            <template x-for="t in tabs" :key="t.key">
              <a href="#" role="tab" :aria-selected="activeTab === t.key" :aria-current="activeTab === t.key ? 'page' : null"
                 @click.prevent="setTab(t.key)">
                <span x-text="t.label"></span>
                <span class="count" x-show="t.count !== null && t.count !== undefined" x-text="t.count"></span>
              </a>
            </template>
          </nav>

          <!-- ===== Aperçu ===== -->
          <div class="stack" x-show="activeTab === 'overview'">
            <section class="card card-pad stack-sm" x-show="scan.summary">
              <div class="row between"><h2>Résumé exécutif</h2><span class="tag">Généré par l'IA</span></div>
              <p class="t2" style="max-width:75ch" x-text="scan.summary"></p>
            </section>
            <section class="card card-pad stack-sm" x-show="ai.risk_narrative">
              <h2>Analyse de risque</h2>
              <p class="t2" style="max-width:75ch" x-text="ai.risk_narrative"></p>
            </section>
            <section class="card" x-show="ai.quick_wins?.length">
              <div class="card-head"><h2>Actions rapides</h2><p>Corrections à fort impact et faible effort</p></div>
              <ul class="list">
                <template x-for="(w, i) in ai.quick_wins || []" :key="i">
                  <li>
                    <svg class="check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>
                    <span x-text="w"></span>
                  </li>
                </template>
              </ul>
            </section>
            <section class="card empty" x-show="!scan.summary && !ai.risk_narrative && !ai.quick_wins?.length">
              <p>Aucune synthèse IA pour cette analyse.</p>
            </section>
          </div>

          <!-- ===== Vulnérabilités ===== -->
          <div class="stack" x-show="activeTab === 'vulns'">
            <div class="row between" x-show="scan.vulnerabilities.length">
              <div class="segmented" role="group" aria-label="Filtrer par sévérité">
                <button type="button" :aria-pressed="sevFilter === '' ? 'true' : 'false'" @click="sevFilter = ''" x-text="'Toutes · ' + scan.vulnerabilities.length"></button>
                <template x-for="s in SEVS" :key="s">
                  <button type="button" x-show="count(s)" :aria-pressed="sevFilter === s ? 'true' : 'false'" @click="sevFilter = s" x-text="sevLabel(s) + ' · ' + count(s)"></button>
                </template>
              </div>
              <label class="search">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                <input type="search" x-model="vulnQuery" placeholder="Rechercher" aria-label="Rechercher une vulnérabilité">
              </label>
            </div>

            <section class="card empty" x-show="!scan.vulnerabilities.length">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>
              <h2>Aucune vulnérabilité détectée</h2>
              <p>Aucun constat n'a été remonté par cette analyse.</p>
            </section>

            <section class="card" x-show="scan.vulnerabilities.length" aria-label="Liste des vulnérabilités">
              <template x-for="(v, i) in visibleVulns" :key="v.id">
                <details class="finding" :open="i === 0 && (v.severity === 'critical' || v.severity === 'high')">
                  <summary>
                    <span class="sev" :class="v.severity" x-text="sevLabel(v.severity)"></span>
                    <div><div class="title" x-text="v.title"></div><div class="sub" x-text="v.category || ''"></div></div>
                    <span class="row" style="gap:10px">
                      <span class="tag mono" x-show="v.cvss_score != null" x-text="'CVSS ' + v.cvss_score?.toFixed(1)"></span>
                      <span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>
                    </span>
                  </summary>
                  <div class="finding-body">
                    <p x-show="v.description" x-text="v.description"></p>
                    <div x-show="v.evidence"><h4>Preuve technique</h4><div class="evidence" x-text="v.evidence"></div></div>
                    <div x-show="v.remediation"><h4>Remédiation</h4><p x-text="v.remediation"></p></div>
                    <div x-show="v.attack_techniques?.length"><h4>Techniques MITRE ATT&amp;CK</h4>
                      <div class="tags"><template x-for="(t, ti) in v.attack_techniques || []" :key="ti">
                        <span class="tag mono" x-text="(t.id || t) + (t.tactic ? ' · ' + t.tactic : '')"></span>
                      </template></div>
                    </div>
                  </div>
                </details>
              </template>
              <p class="muted small" style="padding:20px" x-show="visibleVulns.length === 0">Aucune vulnérabilité ne correspond au filtre.</p>
            </section>
          </div>

          <!-- ===== Chemins d'attaque ===== -->
          <div class="stack" x-show="activeTab === 'attacks'">
            <p class="small muted" x-show="ai.attack_paths?.length">Scénarios d'exploitation identifiés par l'IA à partir des vulnérabilités détectées.</p>
            <section class="card empty" x-show="!ai.attack_paths?.length"><p>Aucun chemin d'attaque modélisé pour cette analyse.</p></section>
            <template x-for="(ap, idx) in ai.attack_paths || []" :key="idx">
              <section class="card">
                <div class="card-head">
                  <div class="stack-sm" style="gap:2px">
                    <h2 x-text="ap.name || ap.title || ('Scénario ' + (idx + 1))"></h2>
                    <p x-show="ap.probability" x-text="'Probabilité ' + ({ high: 'élevée', medium: 'moyenne', low: 'faible' }[ap.probability] || ap.probability)"></p>
                  </div>
                  <span class="sev" :class="ap.severity" x-show="ap.severity" x-text="sevLabel(ap.severity)"></span>
                </div>
                <div class="card-body grid-2" style="gap:24px">
                  <div class="stack">
                    <p class="label">Étapes</p>
                    <ol class="path"><template x-for="(st, si) in ap.steps || []" :key="si"><li x-text="st"></li></template></ol>
                  </div>
                  <div class="stack">
                    <div class="stack-sm" x-show="ap.prerequisites"><p class="label">Prérequis</p><p class="small t2" x-text="ap.prerequisites"></p></div>
                    <div class="stack-sm" x-show="ap.impact"><p class="label">Impact</p><p class="small t2" x-text="ap.impact"></p></div>
                    <div class="stack-sm" x-show="ap.mitre_techniques?.length"><p class="label">Techniques MITRE ATT&amp;CK</p>
                      <div class="tags"><template x-for="(t, ti) in ap.mitre_techniques || []" :key="ti"><span class="tag mono" x-text="t"></span></template></div>
                    </div>
                  </div>
                </div>
              </section>
            </template>
          </div>

          <!-- ===== Remédiation ===== -->
          <div class="stack" x-show="activeTab === 'remediation'">
            <section class="card empty" x-show="!ai.top_priorities?.length"><p>Aucune priorité de remédiation définie.</p></section>
            <section class="card" x-show="ai.top_priorities?.length">
              <div class="card-head"><h2>Plan de remédiation priorisé</h2><p>Classé par impact sur le risque</p></div>
              <ol class="list">
                <template x-for="(p, i) in ai.top_priorities || []" :key="i">
                  <li>
                    <span class="step-n" x-text="p.rank || i + 1"></span>
                    <div class="stack-sm" style="flex:1">
                      <b style="font-weight:500" x-text="p.action"></b>
                      <p class="small t2" x-show="p.reason" x-text="p.reason"></p>
                      <div class="row xs muted" style="gap:16px">
                        <span x-text="'Effort : ' + (p.effort || '—')"></span>
                        <span x-text="'Impact attendu : ' + (p.impact_if_fixed || '—')"></span>
                      </div>
                    </div>
                  </li>
                </template>
              </ol>
            </section>
          </div>

          <!-- ===== Conformité ===== -->
          <div class="stack" x-show="activeTab === 'compliance'">
            <template x-if="scan.compliance_reports">
              <div class="stack">
                <div>
                  <h2>Rapport de conformité</h2>
                  <p class="small muted">
                    Score global <b class="num" style="color:var(--text)" x-text="scan.compliance_reports.global_score?.toFixed(0) + ' / 100'"></b>
                    · note <b style="color:var(--text)" x-text="scan.compliance_reports.global_grade"></b>.
                    <span x-text="scan.compliance_reports.summary || ''"></span>
                  </p>
                </div>
                <div class="grid-3" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
                  <template x-for="(fw, fi) in scan.compliance_reports.frameworks" :key="fw.framework">
                    <button type="button" class="card card-pad stack-sm fw-card"
                            :style="fwIndex === fi && 'border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)'"
                            :aria-pressed="fwIndex === fi ? 'true' : 'false'" @click="fwIndex = fi">
                      <p class="small" x-text="fw.framework + ' ' + (fw.version || '')"></p>
                      <div class="score"><strong style="font-size:28px" x-text="fw.overall_score?.toFixed(0)"></strong><span x-text="'/ 100 · ' + fw.grade"></span></div>
                      <div class="bar" :class="scoreBar(fw.overall_score)"><span :style="`width:${fw.overall_score}%`"></span></div>
                      <p class="xs muted" x-text="fw.passed + ' conformes · ' + (fw.partial || 0) + ' partiels · ' + fw.failed + ' non conformes'"></p>
                    </button>
                  </template>
                </div>

                <template x-for="(fw, fi) in scan.compliance_reports.frameworks" :key="'d' + fw.framework">
                  <section class="card" x-show="fwIndex === fi">
                    <div class="card-head">
                      <div class="stack-sm" style="gap:2px"><h2 x-text="'Contrôles · ' + fw.framework + ' ' + (fw.version || '')"></h2><p x-text="fw.compliance_statement || ''"></p></div>
                      <p x-text="(fw.controls || []).length + ' contrôles'"></p>
                    </div>
                    <template x-for="c in fw.controls || []" :key="c.id">
                      <details class="finding" :open="c.status === 'fail'">
                        <summary class="ctrl-sum">
                          <span class="mono muted" x-text="c.id"></span>
                          <div><div class="title" x-text="c.title"></div><div class="sub" x-text="c.category || ''"></div></div>
                          <span class="row" style="gap:12px">
                            <span class="num small muted" x-text="c.score != null ? c.score + ' %' : '—'"></span>
                            <span class="tag" :class="ctrlCls(c.status)" x-text="ctrlLabel(c.status)"></span>
                            <span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>
                          </span>
                        </summary>
                        <div class="finding-body" style="padding-left:20px">
                          <div x-show="c.requirement"><h4>Exigence du standard</h4><p x-text="c.requirement"></p></div>
                          <div x-show="c.evidence?.length"><h4>Preuves du scan</h4>
                            <ul class="evidence-list"><template x-for="(ev, ei) in c.evidence || []" :key="ei"><li x-text="ev"></li></template></ul>
                          </div>
                          <div x-show="c.impact"><h4>Impact business / légal</h4><p x-text="c.impact"></p></div>
                          <div x-show="c.status !== 'pass' && c.remediation?.length"><h4>Plan de remédiation</h4>
                            <ol style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px"><template x-for="(r, ri) in c.remediation || []" :key="ri"><li x-text="r"></li></template></ol>
                          </div>
                          <div x-show="c.cwe_references?.length"><h4>Références CWE</h4>
                            <div class="tags"><template x-for="cwe in c.cwe_references || []" :key="cwe">
                              <a class="tag mono" target="_blank" rel="noopener" :href="'https://cwe.mitre.org/data/definitions/' + cwe.replace('CWE-', '') + '.html'" x-text="cwe"></a>
                            </template></div>
                          </div>
                        </div>
                      </details>
                    </template>
                  </section>
                </template>
              </div>
            </template>
          </div>

          <!-- ===== Threat Intel ===== -->
          <div class="stack" x-show="activeTab === 'threat_intel'">
            <section class="card empty" x-show="!ti"><p>Données Threat Intelligence non disponibles.</p></section>
            <template x-if="ti">
              <div class="stack">
                <section class="stats">
                  <div class="stat"><p>Score de menace</p>
                    <strong :class="tiCls(ti.risk_level)" x-text="ti.threat_score != null ? ti.threat_score.toFixed(1) : '—'"></strong>
                    <small x-text="sevLabel(ti.risk_level) || '—'"></small></div>
                  <div class="stat"><p>Adresse IP</p><strong class="mono" style="font-size:16px;margin-top:10px" x-text="ti.ip || '—'"></strong><small x-text="ti.domain || ''"></small></div>
                  <div class="stat" x-show="ti.abuse?.confidence_score !== undefined"><p>Score d'abus</p><strong x-text="(ti.abuse?.confidence_score ?? 0) + ' %'"></strong><small x-text="(ti.abuse?.total_reports ?? 0) + ' signalements'"></small></div>
                  <div class="stat"><p>Listes DNSBL</p><strong :class="ti.blacklists?.listed > 0 && 'c-critical'" x-text="(ti.blacklists?.listed ?? 0) + ' / ' + (ti.blacklists?.checked ?? 0)"></strong><small>listes de blocage</small></div>
                </section>

                <div class="grid-2">
                  <section class="card" x-show="ti.geolocation?.country">
                    <div class="card-head"><h2>Géolocalisation et ASN</h2></div>
                    <dl class="kv-list card-body" style="padding-top:8px;padding-bottom:8px">
                      <div><dt>Pays</dt><dd x-text="(ti.geolocation?.country || '—') + (ti.geolocation?.country_code ? ' (' + ti.geolocation.country_code + ')' : '')"></dd></div>
                      <div><dt>Ville / Région</dt><dd x-text="[ti.geolocation?.city, ti.geolocation?.region].filter(Boolean).join(', ') || '—'"></dd></div>
                      <div><dt>ISP / Org</dt><dd x-text="ti.geolocation?.org || ti.geolocation?.isp || '—'"></dd></div>
                      <div><dt>ASN</dt><dd class="mono" x-text="ti.geolocation?.asn || '—'"></dd></div>
                      <div><dt>Fuseau horaire</dt><dd x-text="ti.geolocation?.timezone || '—'"></dd></div>
                      <div><dt>Datacenter / Hosting</dt><dd x-text="ti.geolocation?.is_hosting ? 'Oui' : 'Non'"></dd></div>
                    </dl>
                  </section>
                  <section class="card">
                    <div class="card-head"><h2>Domaine (RDAP)</h2></div>
                    <dl class="kv-list card-body" style="padding-top:8px;padding-bottom:8px">
                      <div><dt>Domaine</dt><dd class="mono" x-text="ti.domain || '—'"></dd></div>
                      <div><dt>Registrar</dt><dd x-text="ti.domain_info?.registrar || '—'"></dd></div>
                      <div><dt>Création</dt><dd x-text="ti.domain_info?.creation_date || '—'"></dd></div>
                      <div><dt>Expiration</dt><dd x-text="ti.domain_info?.expiry_date || '—'"></dd></div>
                      <div x-show="ti.domain_info?.age_days !== undefined"><dt>Ancienneté</dt>
                        <dd :class="ti.domain_info?.age_days < 30 ? 'c-critical' : ti.domain_info?.age_days < 180 ? 'c-medium' : ''" x-text="ti.domain_info?.age_days + ' jours'"></dd></div>
                      <div x-show="ti.domain_info?.status?.length"><dt>Statut</dt><dd class="mono xs" x-text="ti.domain_info?.status?.join(', ')"></dd></div>
                    </dl>
                  </section>
                  <section class="card" x-show="ti.abuse?.confidence_score !== undefined">
                    <div class="card-head"><h2>AbuseIPDB</h2></div>
                    <dl class="kv-list card-body" style="padding-top:8px;padding-bottom:8px">
                      <div><dt>Score de confiance</dt><dd :class="ti.abuse?.confidence_score >= 50 && 'c-critical'" x-text="ti.abuse?.confidence_score + ' %'"></dd></div>
                      <div><dt>Signalements</dt><dd x-text="ti.abuse?.total_reports ?? 0"></dd></div>
                      <div x-show="ti.abuse?.last_reported"><dt>Dernier signalement</dt><dd x-text="ti.abuse?.last_reported"></dd></div>
                      <div x-show="ti.abuse?.usage_type"><dt>Type d'usage</dt><dd x-text="ti.abuse?.usage_type"></dd></div>
                      <div><dt>Nœud Tor</dt><dd x-text="ti.abuse?.is_tor ? 'Oui' : 'Non'"></dd></div>
                    </dl>
                  </section>
                  <section class="card">
                    <div class="card-head"><h2>Listes de blocage DNSBL</h2><p x-text="(ti.blacklists?.listed ?? 0) + ' sur ' + (ti.blacklists?.checked ?? 0)"></p></div>
                    <div class="table-wrap"><table><tbody>
                      <template x-for="h in ti.blacklists?.hits || []" :key="h.name">
                        <tr><td class="mono" x-text="h.name"></td><td class="r"><span class="tag" :class="h.listed ? 'fail' : 'ok'" x-text="h.listed ? 'Listée' : 'Propre'"></span></td></tr>
                      </template>
                    </tbody></table></div>
                  </section>
                </div>

                <section class="card">
                  <div class="card-head"><h2>Enregistrements DNS</h2></div>
                  <div class="table-wrap"><table>
                    <thead><tr><th style="width:90px">Type</th><th>Valeur(s)</th></tr></thead>
                    <tbody>
                      <template x-for="[t, recs] in Object.entries(ti.dns_records || {})" :key="t">
                        <tr><td class="mono" x-text="t"></td><td class="mono" style="overflow-wrap:anywhere" x-text="[].concat(recs).join(', ')"></td></tr>
                      </template>
                      <tr x-show="!Object.keys(ti.dns_records || {}).length"><td colspan="2" class="muted">Aucun enregistrement DNS récupéré.</td></tr>
                    </tbody>
                  </table></div>
                </section>
              </div>
            </template>
          </div>

          <!-- ===== Sous-domaines ===== -->
          <div class="stack" x-show="activeTab === 'subdomains'">
            <section class="card empty" x-show="!sub"><p>Données de sous-domaines non disponibles.</p></section>
            <template x-if="sub">
              <div class="stack">
                <div class="note warn" x-show="takeovers.length">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v4M12 17.5v.5"/></svg>
                  <span x-text="takeovers.length + ' sous-domaine(s) exposé(s) à une prise de contrôle : ' + takeovers.map(s => s.subdomain + (s.takeover_service ? ' (' + s.takeover_service + ')' : '')).join(', ') + '.'"></span>
                </div>
                <div class="row xs muted" style="gap:8px">
                  Sources :
                  <span class="tag" x-text="'crt.sh · ' + (sub.sources?.crtsh ?? 0)"></span>
                  <span class="tag" x-text="'HackerTarget · ' + (sub.sources?.hackertarget ?? 0)"></span>
                  <span class="tag" x-text="'Brute-force · ' + (sub.sources?.bruteforce ?? 0)"></span>
                  <span class="tag" x-text="'DNS · ' + (sub.sources?.dns_records ?? 0)"></span>
                  <span class="tag" :class="sub.zone_transfer_vulnerable && 'fail'" x-text="'Zone transfer (AXFR) · ' + (sub.zone_transfer_vulnerable ? 'vulnérable' : 'refusé')"></span>
                  <span class="tag" :class="sub.wildcard_detected && 'warn'" x-text="'Wildcard · ' + (sub.wildcard_detected ? (sub.wildcard_ips || []).join(', ') : 'non détecté')"></span>
                </div>

                <section class="card">
                  <div class="card-head">
                    <h2>Sous-domaines découverts</h2>
                    <div class="row">
                      <div class="segmented" role="group" aria-label="Filtrer">
                        <button type="button" :aria-pressed="subFilter === '' ? 'true' : 'false'" @click="subFilter = ''">Tous</button>
                        <button type="button" :aria-pressed="subFilter === 'active' ? 'true' : 'false'" @click="subFilter = 'active'">Actifs</button>
                        <button type="button" :aria-pressed="subFilter === 'takeover' ? 'true' : 'false'" @click="subFilter = 'takeover'">Takeover</button>
                      </div>
                      <label class="search">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                        <input type="search" x-model="subQuery" placeholder="Filtrer" aria-label="Filtrer les sous-domaines">
                      </label>
                    </div>
                  </div>
                  <div class="table-wrap"><table style="min-width:820px">
                    <thead><tr><th>Sous-domaine</th><th>HTTP</th><th>IP</th><th>Titre</th><th>Source</th><th class="r">Risque</th></tr></thead>
                    <tbody>
                      <template x-for="(s, i) in visibleSubs" :key="i">
                        <tr>
                          <td>
                            <a class="target" x-show="s.status_code != null" target="_blank" rel="noopener" :href="(s.https ? 'https://' : 'http://') + s.subdomain" x-text="s.subdomain"></a>
                            <span class="mono" x-show="s.status_code == null" x-text="s.subdomain"></span>
                          </td>
                          <td><span class="tag mono" :class="httpCls(s.status_code)" x-show="s.status_code != null" x-text="(s.https ? 'TLS · ' : '') + s.status_code"></span><span class="muted" x-show="s.status_code == null">—</span></td>
                          <td class="mono" x-text="(s.ips || []).slice(0, 2).join(', ') + ((s.ips?.length > 2) ? ' +' + (s.ips.length - 2) : '') || '—'"></td>
                          <td x-text="s.title ? s.title.slice(0, 60) + (s.title.length > 60 ? '…' : '') : '—'" :title="s.title || ''"></td>
                          <td class="muted" x-text="srcLabel(s.source)"></td>
                          <td class="r"><span class="tag fail" x-show="s.takeover_risk" :title="s.takeover_service || ''">Takeover</span></td>
                        </tr>
                      </template>
                      <tr x-show="visibleSubs.length === 0"><td colspan="6" class="muted" style="text-align:center;padding:32px">Aucun sous-domaine ne correspond au filtre.</td></tr>
                    </tbody>
                  </table></div>
                </section>
              </div>
            </template>
          </div>

          <!-- ===== API ===== -->
          <div class="stack" x-show="activeTab === 'api'">
            <section class="card empty" x-show="!api"><p>Données API non disponibles.</p></section>
            <template x-if="api">
              <div class="stack">
                <section class="stats">
                  <div class="stat"><p>Endpoints</p><strong x-text="api.total_endpoints ?? 0"></strong><small>découverts</small></div>
                  <div class="stat"><p>Critiques</p><strong :class="count('critical') > 0 && 'c-critical'" x-text="count('critical')"></strong><small>constats</small></div>
                  <div class="stat"><p>Swagger / OpenAPI</p><strong style="font-size:18px;margin-top:10px" x-text="api.swagger_found ? 'Trouvé' : 'Absent'"></strong><small class="mono" x-text="api.swagger_url || ''"></small></div>
                  <div class="stat"><p>GraphQL</p><strong style="font-size:18px;margin-top:10px" :class="api.graphql_found && 'c-medium'" x-text="api.graphql_found ? 'Détecté' : 'Absent'"></strong></div>
                </section>
                <section class="card card-pad stack-sm">
                  <h2>Couverture OWASP API Top 10 (2023)</h2>
                  <p class="small muted" x-show="!api.owasp_coverage?.length">Aucune catégorie en échec.</p>
                  <div class="tags"><template x-for="c in api.owasp_coverage || []" :key="c"><span class="tag fail" x-text="c"></span></template></div>
                </section>
                <section class="card">
                  <div class="card-head"><h2>Endpoints découverts</h2>
                    <label class="search">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                      <input type="search" x-model="epQuery" placeholder="Filtrer par chemin" aria-label="Filtrer les endpoints">
                    </label>
                  </div>
                  <div class="table-wrap"><table style="min-width:640px">
                    <thead><tr><th>Méthode</th><th>Endpoint</th><th>Statut</th><th class="r">Taille</th><th class="r">Latence</th></tr></thead>
                    <tbody>
                      <template x-for="(ep, i) in (api.endpoints_found || []).filter(e => !epQuery || (e.path || '').includes(epQuery))" :key="i">
                        <tr>
                          <td><span class="tag mono" x-text="ep.method || 'GET'"></span></td>
                          <td class="mono" style="color:var(--text)" x-text="ep.path || ep.url"></td>
                          <td><span class="tag mono" :class="httpCls(ep.status_code)" x-text="ep.status_code ?? '—'"></span></td>
                          <td class="r num" x-text="ep.response_size ? (ep.response_size > 1024 ? (ep.response_size / 1024).toFixed(1) + ' Ko' : ep.response_size + ' o') : '—'"></td>
                          <td class="r num" x-text="ep.response_time_ms ? ep.response_time_ms + ' ms' : '—'"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table></div>
                </section>
              </div>
            </template>
          </div>

          <!-- ===== OSINT ===== -->
          <div class="stack" x-show="activeTab === 'osint'">
            <section class="card empty" x-show="!osint"><p>Données OSINT non disponibles.</p></section>
            <template x-if="osint">
              <div class="stack">
                <section class="stats">
                  <div class="stat"><p>Emails exposés</p><strong x-text="osint.emails_found?.length ?? 0"></strong><small>trouvés publiquement</small></div>
                  <div class="stat"><p>Fuites de données</p><strong :class="osint.breach_data?.breaches_found > 0 && 'c-critical'" x-text="osint.breach_data?.breaches_found ?? 0"></strong><small>breaches connues</small></div>
                  <div class="stat"><p>Exposition GitHub</p><strong :class="osint.github_exposure?.leaks_found > 0 && 'c-medium'" x-text="osint.github_exposure?.leaks_found ?? 0"></strong><small>résultats sensibles</small></div>
                  <div class="stat"><p>Certificat TLS</p><strong :class="sslCls(osint.ssl_cert?.days_remaining)" x-text="osint.ssl_cert?.days_remaining != null ? osint.ssl_cert.days_remaining + ' j' : '—'"></strong><small>avant expiration</small></div>
                </section>

                <div class="grid-2">
                  <section class="card"><div class="card-head"><h2>WHOIS / Domaine</h2></div>
                    <dl class="kv-list card-body" style="padding-top:8px;padding-bottom:8px">
                      <div><dt>Registrar</dt><dd x-text="osint.whois?.registrar || '—'"></dd></div>
                      <div><dt>Organisation</dt><dd x-text="osint.whois?.registrant_org || '—'"></dd></div>
                      <div><dt>Création</dt><dd x-text="(osint.whois?.created || '—').slice(0, 10)"></dd></div>
                      <div><dt>Expiration</dt><dd x-text="(osint.whois?.expires || '—').slice(0, 10)"></dd></div>
                    </dl></section>
                  <section class="card"><div class="card-head"><h2>Certificat SSL/TLS</h2></div>
                    <dl class="kv-list card-body" style="padding-top:8px;padding-bottom:8px">
                      <div><dt>Sujet</dt><dd class="mono" x-text="osint.ssl_cert?.subject || '—'"></dd></div>
                      <div><dt>Émetteur</dt><dd x-text="osint.ssl_cert?.issuer || '—'"></dd></div>
                      <div><dt>Expire dans</dt><dd :class="sslCls(osint.ssl_cert?.days_remaining)" x-text="osint.ssl_cert?.days_remaining != null ? osint.ssl_cert.days_remaining + ' jours' : '—'"></dd></div>
                      <div><dt>Auto-signé</dt><dd :class="osint.ssl_cert?.is_self_signed && 'c-critical'" x-text="osint.ssl_cert?.is_self_signed == null ? '—' : (osint.ssl_cert.is_self_signed ? 'Oui' : 'Non')"></dd></div>
                    </dl></section>
                  <section class="card"><div class="card-head"><h2>Infrastructure</h2></div>
                    <dl class="kv-list card-body" style="padding-top:8px;padding-bottom:8px">
                      <div><dt>Adresses IP</dt><dd class="mono" x-text="(osint.ip_addresses || []).join(', ') || '—'"></dd></div>
                      <div><dt>ASN</dt><dd class="mono" x-text="osint.asn_info?.asn || '—'"></dd></div>
                      <div><dt>Organisation</dt><dd x-text="osint.asn_info?.org || '—'"></dd></div>
                      <div><dt>Pays</dt><dd x-text="osint.asn_info?.country || osint.geo_info?.country || '—'"></dd></div>
                    </dl></section>
                  <section class="card"><div class="card-head"><h2>Technologies détectées</h2></div>
                    <dl class="kv-list card-body" style="padding-top:8px;padding-bottom:8px">
                      <div><dt>Serveur</dt><dd class="mono" x-text="osint.technologies?.server || '—'"></dd></div>
                      <div><dt>X-Powered-By</dt><dd class="mono" x-text="osint.technologies?.powered_by || '—'"></dd></div>
                      <div><dt>CMS</dt><dd x-text="osint.technologies?.cms || '—'"></dd></div>
                      <div x-show="osint.technologies?.frameworks?.length"><dt>Frameworks</dt>
                        <dd><div class="tags" style="justify-content:flex-end"><template x-for="f in osint.technologies?.frameworks || []" :key="f"><span class="tag" x-text="f"></span></template></div></dd></div>
                    </dl></section>
                </div>

                <section class="card">
                  <div class="card-head"><h2>Enregistrements DNS</h2></div>
                  <div class="table-wrap"><table>
                    <thead><tr><th style="width:90px">Type</th><th>Valeur(s)</th></tr></thead>
                    <tbody>
                      <template x-for="t in ['A','AAAA','MX','NS','TXT','CNAME'].filter(t => (osint.dns_records?.[t] || []).length)" :key="t">
                        <tr><td class="mono" x-text="t"></td><td class="mono" style="overflow-wrap:anywhere" x-text="osint.dns_records[t].join(', ')"></td></tr>
                      </template>
                    </tbody>
                  </table></div>
                </section>

                <div class="grid-2">
                  <section class="card"><div class="card-head"><h2>Emails exposés</h2><p x-text="osint.emails_found?.length ?? 0"></p></div>
                    <ul class="list" x-show="osint.emails_found?.length">
                      <template x-for="e in osint.emails_found || []" :key="e"><li style="padding:10px 20px"><span class="mono small" x-text="e"></span></li></template>
                    </ul>
                    <p class="card-body small muted" x-show="!osint.emails_found?.length">Aucun email trouvé publiquement.</p>
                    <div class="card-body" style="border-top:1px solid var(--border)" x-show="osint.breach_data?.breach_names?.length">
                      <p class="xs muted" style="margin-bottom:6px">Fuites connues</p>
                      <div class="tags"><template x-for="b in osint.breach_data?.breach_names || []" :key="b"><span class="tag fail" x-text="b"></span></template></div>
                    </div>
                  </section>
                  <section class="card"><div class="card-head"><h2>Ports ouverts</h2><p x-text="osint.open_ports?.length ?? 0"></p></div>
                    <div class="card-body">
                      <div class="tags" x-show="osint.open_ports?.length"><template x-for="p in osint.open_ports || []" :key="p"><span class="tag warn mono" x-text="p"></span></template></div>
                      <p class="small muted" x-show="!osint.open_ports?.length">Aucun port ouvert détecté.</p>
                      <div x-show="osint.github_exposure?.sample_repos?.length" style="margin-top:16px">
                        <p class="xs muted" style="margin-bottom:6px">Dépôts GitHub mentionnant le domaine</p>
                        <div class="tags"><template x-for="r in osint.github_exposure?.sample_repos || []" :key="r"><span class="tag mono" x-text="r"></span></template></div>
                      </div>
                    </div>
                  </section>
                </div>

                <section class="card" x-show="osint.recommended_dorks?.length">
                  <div class="card-head"><h2>Google Dorks recommandés</h2><p>Recherches à lancer manuellement</p></div>
                  <ul class="list">
                    <template x-for="d in osint.recommended_dorks || []" :key="d">
                      <li style="padding:10px 20px;align-items:center">
                        <code style="flex:1;overflow-wrap:anywhere" x-text="d"></code>
                        <a class="small" target="_blank" rel="noopener" :href="'https://www.google.com/search?q=' + encodeURIComponent(d)">Ouvrir</a>
                      </li>
                    </template>
                  </ul>
                </section>
              </div>
            </template>
          </div>

        </div>
      </template>
    </div>
  </template>
</div>
{% endblock %}

{% block scripts %}
<script>
const SEV_ORDER = { critical: 0, high: 1, medium: 2, low: 3, info: 4 };
const SEV_LABEL = { critical: 'Critique', high: 'Élevée', medium: 'Moyenne', low: 'Faible', info: 'Info' };

function scanDetailApp(scanId) {
  return {
    scan: null, loading: true,
    activeTab: 'overview',
    SEVS: ['critical', 'high', 'medium', 'low', 'info'],
    sevFilter: '', vulnQuery: '',
    subFilter: '', subQuery: '',
    epQuery: '',
    fwIndex: 0,

    get ai()     { return this.scan?.attack_paths || {}; },
    get ti()     { return this.scan?.threat_intel || null; },
    get sub()    { return this.scan?.subdomain_results || null; },
    get api()    { return this.scan?.api_results || null; },
    get osint()  { return this.scan?.osint_results || null; },

    get tabs() {
      const s = this.scan; if (!s) return [];
      const t = s.scan_type;
      const tabs = [{ key: 'overview', label: 'Aperçu', count: null }];
      if (t === 'cti') tabs.push({ key: 'threat_intel', label: 'Threat Intel', count: null });
      if (t === 'subdomain') tabs.push({ key: 'subdomains', label: 'Sous-domaines', count: this.sub?.total_found ?? null });
      if (t === 'api') tabs.push({ key: 'api', label: 'Endpoints', count: this.api?.total_endpoints ?? null });
      if (t === 'osint') tabs.push({ key: 'osint', label: 'OSINT', count: null });
      tabs.push({ key: 'vulns', label: 'Vulnérabilités', count: s.vulnerabilities?.length ?? 0 });
      if (s.compliance_reports && ['web', 'network', 'authenticated_web'].includes(t)) tabs.push({ key: 'compliance', label: 'Conformité', count: null });
      if (t !== 'cti' && t !== 'osint') {
        tabs.push({ key: 'attacks', label: "Chemins d'attaque", count: this.ai.attack_paths?.length ?? 0 });
        tabs.push({ key: 'remediation', label: 'Remédiation', count: this.ai.top_priorities?.length ?? 0 });
      }
      return tabs;
    },

    get sortedVulns() {
      return [...(this.scan?.vulnerabilities || [])].sort((a, b) =>
        (SEV_ORDER[a.severity] ?? 9) - (SEV_ORDER[b.severity] ?? 9) || (b.cvss_score || 0) - (a.cvss_score || 0));
    },
    get visibleVulns() {
      const q = this.vulnQuery.trim().toLowerCase();
      return this.sortedVulns.filter(v =>
        (!this.sevFilter || v.severity === this.sevFilter) &&
        (!q || (v.title + ' ' + (v.category || '')).toLowerCase().includes(q)));
    },
    get takeovers() { return (this.sub?.subdomains || []).filter(s => s.takeover_risk); },
    get visibleSubs() {
      const q = this.subQuery.trim().toLowerCase();
      return (this.sub?.subdomains || []).filter(s =>
        (!q || s.subdomain.toLowerCase().includes(q)) &&
        (this.subFilter !== 'active' || s.status_code != null) &&
        (this.subFilter !== 'takeover' || s.takeover_risk));
    },
    get duration() {
      if (!this.scan?.completed_at) return '';
      const sec = Math.max(0, Math.round((new Date(this.scan.completed_at) - new Date(this.scan.created_at)) / 1000));
      return sec < 60 ? sec + ' s' : Math.floor(sec / 60) + ' min ' + String(sec % 60).padStart(2, '0') + ' s';
    },

    async init() {
      const hash = window.location.hash.slice(1);
      await this.fetchScan();
      if (hash && this.tabs.some(t => t.key === hash)) this.activeTab = hash;
      setInterval(() => {
        if (this.scan?.status === 'running' || this.scan?.status === 'pending') this.fetchScan();
      }, 3000);
    },

    async fetchScan() {
      try {
        const res = await apiFetch('/scans/' + scanId);
        if (res.ok) this.scan = await res.json();
      } finally {
        this.loading = false;
      }
    },

    setTab(key) {
      this.activeTab = key;
      history.replaceState(null, '', '#' + key);
    },

    count(sev) { return this.scan?.vulnerabilities?.filter(v => v.severity === sev).length || 0; },
    sevLabel(s) { return SEV_LABEL[s] || s; },
    icon(t) { return SS_ICON[t] || ''; },
    typeLabel(t) { return SS_TYPE_LABEL[t] || t; },
    statusLabel(s) { return { pending: 'En attente', running: 'En cours', completed: 'Terminé', failed: 'Échec' }[s] || s; },
    statusDot(s) { return { pending: 'pending', running: 'run', completed: 'ok', failed: 'fail' }[s] || ''; },
    fmtDate(d) { return new Date(d).toLocaleString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }); },
    riskCls(r) { return r == null ? 'muted' : r >= 7 ? 'c-critical' : r >= 5 ? 'c-high' : r >= 3 ? 'c-medium' : 'c-ok'; },
    riskBar(r) { return r == null ? '' : r >= 7 ? 'critical' : r >= 5 ? 'high' : r >= 3 ? 'medium' : 'ok'; },
    riskLabel(r) { return r >= 7 ? 'Élevé' : r >= 4 ? 'Modéré' : 'Faible'; },
    scoreBar(v) { return v >= 60 ? 'ok' : v >= 40 ? 'medium' : 'critical'; },
    tiCls(l) { return { critical: 'c-critical', high: 'c-high', medium: 'c-medium', low: 'c-ok' }[l] || ''; },
    sslCls(d) { return d == null ? '' : d <= 30 ? 'c-critical' : d <= 90 ? 'c-medium' : ''; },
    ctrlCls(s) { return { pass: 'ok', fail: 'fail', partial: 'warn' }[s] || ''; },
    ctrlLabel(s) { return { pass: 'Conforme', fail: 'Non conforme', partial: 'Partiel', na: 'N/A' }[s] || s; },
    httpCls(c) { return c == null ? '' : c < 300 ? 'ok' : c < 400 ? '' : 'warn'; },
    srcLabel(s) { return { 'crt.sh': 'crt.sh', crtsh: 'crt.sh', hackertarget: 'HackerTarget', bruteforce: 'Brute-force', dns_records: 'DNS', zone_transfer: 'Zone transfer' }[s] || s || '—'; },

    openReport() {
      const token = localStorage.getItem('token');
      window.open(`/scans/${scanId}/report?token=${encodeURIComponent(token)}`, '_blank');
    },
  };
}
</script>
{% endblock %}
