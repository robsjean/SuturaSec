<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}SuturaSec{% endblock %}</title>
  <script>
    (function () {
      var s = localStorage.getItem('ss_theme');
      var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', d);
    })();
  </script>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body>

  {% block content %}{% endblock %}

  <script>
    function requireAuth() {
      if (!localStorage.getItem('token')) window.location.href = '/login';
    }
    function redirectIfAuth() {
      if (localStorage.getItem('token')) window.location.href = '/dashboard';
    }
    async function apiFetch(path, options = {}) {
      const token = localStorage.getItem('token');
      const res = await fetch('/api' + path, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...(token ? { Authorization: 'Bearer ' + token } : {}),
          ...(options.headers || {}),
        },
      });
      if (res.status === 401) {
        localStorage.removeItem('token');
        window.location.href = '/login';
      }
      return res;
    }
    function ssToggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('ss_theme', isDark ? 'dark' : 'light');
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
