<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}SuturaSec{% endblock %}</title>
  <script>
    (function () {
      var s = localStorage.getItem('ss_theme');
      var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', d);
    })();
  </script>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>

<body x-data="layoutApp()" x-init="init()" @keydown.escape.window="sidebarOpen = false">

  <div class="shell">

    <!-- Barre mobile -->
    <div class="topbar">
      <button class="btn btn-ghost icon-btn" type="button" @click="sidebarOpen = true" aria-label="Ouvrir le menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="brand" href="/dashboard">SuturaSec</a>
    </div>

    <div class="sidebar-overlay" x-show="sidebarOpen" x-cloak @click="sidebarOpen = false"></div>

    <!-- Barre latérale -->
    <aside class="sidebar" :class="sidebarOpen && 'open'" aria-label="Navigation">
      <a class="brand" href="/dashboard">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>
        SuturaSec
      </a>

      <nav class="nav" aria-label="Navigation principale">
        <a href="/dashboard" :aria-current="isActive('/dashboard') ? 'page' : null">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Tableau de bord
        </a>

        <div class="nav-label">Nouvelle analyse</div>
        <template x-for="t in scanTypes" :key="t.key">
          <button type="button" @click="triggerNewScan(t.key)">
            <span x-html="t.icon"></span>
            <span x-text="t.label"></span>
            <span class="plus" aria-hidden="true">+</span>
          </button>
        </template>

        <div class="nav-label">Bientôt</div>
        <template x-for="f in comingSoon" :key="f">
          <a class="disabled" href="#" aria-disabled="true" tabindex="-1">
            <span x-text="f"></span><span class="soon">Soon</span>
          </a>
        </template>
      </nav>

      <div class="user">
        <div class="avatar" aria-hidden="true" x-text="(user?.username || '?').slice(0, 2).toUpperCase()"></div>
        <div class="user-meta">
          <b x-text="user?.username || '…'"></b>
          <span x-text="user?.email || 'Plan Free'"></span>
        </div>
        <button class="btn btn-ghost icon-btn theme-btn" type="button" @click="toggleTheme()" :aria-label="isDark ? 'Passer en thème clair' : 'Passer en thème sombre'">
          <svg x-show="isDark" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg x-show="!isDark" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="btn btn-ghost icon-btn" type="button" @click="logout()" aria-label="Déconnexion">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h11"/></svg>
        </button>
      </div>
    </aside>

    <main class="main">
      <div class="container">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>

  <script>
    function requireAuth() {
      if (!localStorage.getItem('token')) window.location.href = '/login';
    }
    function redirectIfAuth() {
      if (localStorage.getItem('token')) window.location.href = '/dashboard';
    }
    async function apiFetch(path, options = {}) {
      const token = localStorage.getItem('token');
      const res = await fetch('/api' + path, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...(token ? { Authorization: 'Bearer ' + token } : {}),
          ...(options.headers || {}),
        },
      });
      if (res.status === 401) {
        localStorage.removeItem('token');
        window.location.href = '/login';
      }
      return res;
    }

    /* Libellés et icônes partagés par toutes les pages */
    const SS_ICON = {
      web:       '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"/></svg>',
      authenticated_web: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
      api:       '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4"/></svg>',
      network:   '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-2h12v2"/></svg>',
      subdomain: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>',
      osint:     '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
      cti:       '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6-6"/></svg>',
    };
    const SS_TYPES = [
      { key: 'web',               label: 'Web',           hint: 'OWASP Top 10, TLS, en-têtes' },
      { key: 'authenticated_web', label: 'Authentifié',   hint: 'Tests derrière la connexion' },
      { key: 'api',               label: 'API',           hint: 'OWASP API Top 10 (2023)' },
      { key: 'network',           label: 'Réseau',        hint: 'Hôtes, ports et services' },
      { key: 'subdomain',         label: 'Sous-domaines', hint: 'Découverte et takeover' },
      { key: 'osint',             label: 'OSINT',         hint: 'WHOIS, DNS, emails, dorks' },
      { key: 'cti',               label: 'Threat Intel',  hint: 'Réputation IP et domaine' },
    ].map(t => ({ ...t, icon: SS_ICON[t.key] }));
    const SS_TYPE_LABEL = Object.fromEntries(SS_TYPES.map(t => [t.key, t.label]));

    function layoutApp() {
      return {
        user: null,
        sidebarOpen: false,
        isDark: document.documentElement.classList.contains('dark'),
        scanTypes: SS_TYPES,
        comingSoon: ['Cloud Security', 'Phishing Simulator', 'Comparaison de scans'],

        async init() {
          requireAuth();
          try {
            const res = await apiFetch('/auth/me');
            if (res.ok) this.user = await res.json();
          } catch {}
        },

        isActive(path) {
          const p = window.location.pathname;
          if (path === '/dashboard') return p === '/dashboard' || p.startsWith('/scans/');
          return p === path;
        },

        toggleTheme() {
          this.isDark = document.documentElement.classList.toggle('dark');
          localStorage.setItem('ss_theme', this.isDark ? 'dark' : 'light');
        },

        triggerNewScan(type) {
          if (window.location.pathname === '/dashboard') {
            window.dispatchEvent(new CustomEvent('open-new-scan', { detail: { type } }));
          } else {
            window.location.href = '/dashboard?scan=' + type;
          }
          this.sidebarOpen = false;
        },

        logout() {
          localStorage.removeItem('token');
          window.location.href = '/login';
        }
      }
    }
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
